databaseChangeLog:
  - changeSet:
      id: 3
      author: Jakub1
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: patients
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    unique: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(250)
              - column:
                  name: id_card_no
                  type: varchar(250)
              - column:
                  name: first_name
                  type: varchar(250)
              - column:
                  name: last_name
                  type: varchar(250)
              - column:
                  name: phone_number
                  type: varchar(250)
              - column:
                  name: birthday
                  type: date



databaseChangeLog:
  - changeSet:
      id: 4
      author: Jakub2
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    unique: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(250)
              - column:
                  name: password
                  type: varchar(250)
        - addColumn:
            tableName: patients
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKey: true
                    foreignKeyName: fk_user_id
                    references: PATIENTS(id)